name = "candle-timer"
main = "worker.js"

# the site's own address. workers.dev keeps working too, so old links still open
routes = [{ pattern = "studyduel.fun", custom_domain = true }]
workers_dev = true
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

# One Durable Object per race. Both players hold a socket to it, and it owns
# the only real copy of the game state.
[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameRoom"

# One tiny Durable Object per 6-digit join code, pointing at its room.
[[durable_objects.bindings]]
name = "CODES"
class_name = "JoinCode"

# Makes the questions for one study set. The work runs in its alarm.
[[durable_objects.bindings]]
name = "SETJOB"
class_name = "SetJob"

# SQLite-backed classes are the ones the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JoinCode"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SetJob"]

# Spending caps for making questions. DAILY_BUDGET_USD is the most the whole app
# will spend on the API per day (UTC); DEVICE_RUNS_PER_DAY is how many runs one
# browser gets. Set GENERATION_ENABLED = "false" to switch it off altogether.
# The API key itself is a secret: `npx wrangler secret put ANTHROPIC_API_KEY`.
[vars]
DAILY_BUDGET_USD = "5"
DEVICE_RUNS_PER_DAY = "5"
GENERATION_ENABLED = "true"
# who sign-in emails come from: studyduel.fun is verified in Resend (its DKIM,
# send/rsend and _dmarc records are in Cloudflare DNS). The key is a secret:
# `npx wrangler secret put RESEND_API_KEY`.
MAIL_FROM = "Study Duel <codes@studyduel.fun>"

# Study sets, their source text and generated questions. Live matches stay in
# the GameRoom Durable Objects. Apply schema changes with
# `npx wrangler d1 migrations apply study-duel --remote`.
[[d1_databases]]
binding = "DB"
database_name = "study-duel"
database_id = "8af16b05-6087-4169-aad4-4141275e454a"
migrations_dir = "migrations"
