name = "candle-timer"
main = "worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "./public"
binding = "ASSETS"

# One Durable Object per race. Both players hold a socket to it, and it owns
# the only real copy of the game state.
[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameRoom"

# SQLite-backed classes are the ones the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]
