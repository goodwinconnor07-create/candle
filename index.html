<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candle Timer</title>
<style>
  :root{
    --flame-h: 1;          /* flicker multiplier, nudged by JS */
    --glow: 0;             /* room light level 0..1 */
    --wax: #efe2c8;
    --wax-shade: #c8b795;

    /* flame palette — JS overwrites these inline when you pick a colour */
    --flame-outer-1: rgba(255,148,40,.95);
    --flame-outer-2: rgba(255,92,10,.55);
    --flame-outer-3: rgba(255,60,0,0);
    --flame-mid-1: #ffb43c;
    --flame-mid-2: #ffd97a;
    --flame-mid-3: #fff3c4;
    --flame-core-1: #5fa8ff;
    --flame-core-2: #cfe6ff;
    --wick-lit-1: #ffcf7a;
    --wick-lit-2: #6b3a16;
    --wick-glow: rgba(255,170,70,.9);
    --room-1: rgba(255,168,72,.28);
    --room-2: rgba(255,130,40,.13);
    --room-3: rgba(120,60,20,.05);
    --pool-1: rgba(255,160,60,.16);
    --accent: #ffd9a0;
    --accent-soft: rgba(255,205,145,.55);
    --accent-glow: rgba(255,150,50,.45);
    --accent-mid: rgba(255,168,72,.85);
    --thumb-1: #fff1d6;
    --thumb-2: #ff9e3f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#000;
    color:#e8dcc6;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; padding:24px 16px;
    /* auto-centre, but stay scrollable on short screens so the picker
       panel can't get cut off the way justify-content + overflow:hidden did */
    overflow-x:hidden; overflow-y:auto;
    -webkit-tap-highlight-color: transparent;
  }

  /* the dim room: a pool of light that only exists once the wick catches */
  .room{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(60vmin 55vmin at 50% 46%,
        var(--room-1) 0%,
        var(--room-2) 35%,
        var(--room-3) 60%,
        rgba(0,0,0,0) 78%);
    opacity: calc(var(--glow) * 1);
    transition: opacity 1.4s ease;
  }
  .room.flicker{ animation: roomBreathe 5.5s ease-in-out infinite; }
  @keyframes roomBreathe{ 0%,100%{ filter:brightness(1) } 43%{ filter:brightness(1.12) } 70%{ filter:brightness(.93) } }

  .stage{
    position:relative; z-index:1; margin:auto 0;
    display:flex; flex-direction:column; align-items:center; gap:34px;
  }

  /* ---------- candle ---------- */
  .candle-area{
    position:relative; width:220px; height:364px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  }
  /* the candle's height is the burn-down readout, so never let flex shrink it */
  .flame-slot, .candle, .holder{ flex:0 0 auto; }

  .flame-slot{ position:relative; width:60px; height:96px; }

  .wick-hit{
    position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    width:64px; height:74px; border:0; background:transparent; padding:0;
    cursor:pointer; border-radius:32px;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .wick-hit:focus-visible{ outline:2px solid rgba(255,190,110,.75); outline-offset:4px; }
  .wick{
    width:3px; height:15px; border-radius:2px 2px 0 0;
    background:linear-gradient(#4b4038,#22201e);
    transition: background .8s ease, box-shadow .8s ease;
  }
  .lit .wick{
    background:linear-gradient(var(--wick-lit-1), var(--wick-lit-2));
    box-shadow:0 0 6px var(--wick-glow);
  }
  /* small hint pulse so it's obvious what to click */
  .wick-hint{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(232,220,198,.28);
    animation: hintPulse 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  .lit .wick-hint, .done .wick-hint{ display:none; }
  @keyframes hintPulse{
    0%,100%{ transform:translateX(-50%) scale(.85); opacity:.18 }
    50%    { transform:translateX(-50%) scale(1.25); opacity:.5 }
  }

  /* flame: three stacked blurred blobs */
  .flame{
    position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
    width:34px; height:74px; opacity:0; pointer-events:none;
    transition: opacity .35s ease;
  }
  .lit .flame{ opacity:1; }
  .flame span{
    position:absolute; left:50%; bottom:0; display:block;
    border-radius:50% 50% 34% 34% / 66% 66% 34% 34%;
    transform-origin:50% 100%;
  }
  .f-outer{
    width:34px; height:74px; margin-left:-17px;
    background:radial-gradient(ellipse at 50% 88%, var(--flame-outer-1), var(--flame-outer-2) 55%, var(--flame-outer-3) 78%);
    filter:blur(5px);
    animation: flick 2.1s ease-in-out infinite;
  }
  .f-mid{
    width:20px; height:50px; margin-left:-10px;
    background:linear-gradient(to top, var(--flame-mid-1) 0%, var(--flame-mid-2) 45%, var(--flame-mid-3) 78%, rgba(255,255,255,.2) 100%);
    filter:blur(1.6px);
    animation: flick 1.5s ease-in-out infinite reverse;
  }
  .f-core{
    width:8px; height:17px; margin-left:-4px;
    background:linear-gradient(to top, var(--flame-core-1), var(--flame-core-2) 60%, rgba(255,255,255,.85));
    filter:blur(1.5px); opacity:.85;
    animation: flick 1.1s ease-in-out infinite;
  }
  @keyframes flick{
    0%,100%{ transform: scale(1, calc(1 * var(--flame-h))) translateX(0) skewX(0deg) }
    22%    { transform: scale(.94, calc(1.07 * var(--flame-h))) translateX(-1px) skewX(-2.5deg) }
    48%    { transform: scale(1.05, calc(.9 * var(--flame-h))) translateX(1px) skewX(2deg) }
    74%    { transform: scale(.97, calc(1.04 * var(--flame-h))) translateX(-.5px) skewX(-1deg) }
  }

  /* smoke when it goes out */
  .smoke{ position:absolute; left:50%; bottom:16px; width:2px; height:2px; pointer-events:none; }
  .smoke i{
    position:absolute; left:0; bottom:0; width:9px; height:9px; margin-left:-4px;
    border-radius:50%; background:rgba(200,200,205,.34); filter:blur(4px); opacity:0;
  }
  .smoke.puff i{ animation: rise 2.8s ease-out forwards; }
  .smoke.puff i:nth-child(2){ animation-delay:.28s }
  .smoke.puff i:nth-child(3){ animation-delay:.56s }
  @keyframes rise{
    0%  { opacity:.55; transform:translate(0,0) scale(.6) }
    45% { opacity:.35; transform:translate(7px,-42px) scale(1.5) }
    100%{ opacity:0;   transform:translate(-5px,-96px) scale(2.4) }
  }

  .candle{
    position:relative; width:92px;
    height:230px;                       /* JS shrinks this as time burns down */
    border-radius:8px 8px 5px 5px;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,.42) 0%, rgba(0,0,0,.12) 14%,
        rgba(255,255,255,.16) 38%, rgba(255,255,255,.05) 62%,
        rgba(0,0,0,.2) 86%, rgba(0,0,0,.45) 100%),
      linear-gradient(to bottom, var(--wax-shade), var(--wax) 12%, var(--wax) 78%, #d9c9a8 100%);
    filter: brightness(.34) saturate(.45);
    transition: filter 1.4s ease, height .9s linear;
  }
  .lit .candle{
    filter: brightness(1) saturate(1);
    /* the flame washes its own colour over the wax below it */
    box-shadow: 0 -14px 38px -10px var(--accent-glow);
  }
  .done .candle{ filter: brightness(.62) saturate(.8); }   /* afterglow, no flame */
  .candle::before{                       /* molten top */
    content:""; position:absolute; top:-7px; left:0; right:0; height:14px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, #fff6e2, #e6d5b4 60%, #cbb894);
  }
  .candle::after{                        /* wax pooled in the dip */
    content:""; position:absolute; top:-2px; left:50%; transform:translateX(-50%);
    width:34px; height:8px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(180,150,105,.85), rgba(180,150,105,0) 70%);
  }
  .drip{
    position:absolute; width:11px; border-radius:6px 6px 8px 8px;
    background:linear-gradient(to bottom, #f6ebd6, #dbc9a6);
    box-shadow:inset -2px 0 3px rgba(0,0,0,.18);
  }
  .drip.a{ left:9px; top:6px; height:44px; }
  .drip.b{ right:13px; top:2px; height:26px; width:9px; }

  .holder{
    width:150px; height:22px; margin-top:-3px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 34%, #6b5a45, #3a3027 62%, #14110e);
    filter: brightness(.4);
    transition: filter 1.4s ease;
  }
  .lit .holder{ filter: brightness(1); }
  .done .holder{ filter: brightness(.62); }
  .pool{
    position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
    width:250px; height:40px; border-radius:50%;
    background:radial-gradient(ellipse, var(--pool-1), transparent 70%);
    opacity:var(--glow); transition:opacity 1.4s ease; pointer-events:none;
  }

  /* ---------- readout ---------- */
  .readout{ text-align:center; }
  .time{
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    letter-spacing:.06em; line-height:1;
    color:rgba(232,220,198,.3);
    transition:color 1.4s ease, text-shadow 1.4s ease;
  }
  .lit .time{ color:var(--accent); text-shadow:0 0 22px var(--accent-glow); }
  .done .time{ color:rgba(232,220,198,.55); }
  .label{
    margin-top:12px; font-size:.82rem; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(232,220,198,.32); transition:color 1.2s ease;
  }
  .lit .label{ color:var(--accent-soft); }

  .controls{ margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.ctl{
    font: inherit; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(232,220,198,.6); background:transparent;
    border:1px solid rgba(232,220,198,.22); border-radius:999px;
    padding:9px 18px; cursor:pointer;
    transition: color .25s ease, border-color .25s ease, background .25s ease;
  }
  button.ctl:hover{ color:#ffd9a0; border-color:rgba(255,190,120,.5); background:rgba(255,160,60,.07); }
  button.ctl:focus-visible{ outline:2px solid rgba(255,190,110,.7); outline-offset:3px; }
  button.ctl[hidden]{ display:none; }

  /* ---------- burn-time picker ---------- */
  .picker{ margin-top:18px; }
  .picker-tabs{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .picker-sep{ color:rgba(232,220,198,.2); font-size:.7rem; }
  .picker-toggle{
    font: inherit; font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;
    color:rgba(232,220,198,.34); background:transparent; border:0; padding:6px 4px;
    cursor:pointer; border-bottom:1px dotted rgba(232,220,198,.28);
    transition: color .25s ease, border-color .25s ease;
  }
  .picker-toggle:hover{ color:rgba(255,205,145,.8); border-bottom-color:rgba(255,190,120,.5); }
  .picker-toggle:focus-visible{ outline:2px solid rgba(255,190,110,.7); outline-offset:4px; }
  .lit .picker-toggle{ color:rgba(255,205,145,.4); }

  .picker-panel{
    overflow:hidden; max-height:0; opacity:0; visibility:hidden;
    transition: max-height .3s ease, opacity .3s ease, visibility .3s;
  }
  .picker-panel.open{ max-height:210px; opacity:1; visibility:visible; }
  .picker-inner{
    margin:12px auto 0; width:min(280px, 82vw); padding:16px 18px 13px;
    border:1px solid rgba(232,220,198,.16); border-radius:14px;
    background:rgba(18,13,7,.72);
    box-shadow:0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,220,170,.05);
  }
  .picker-value{
    font-size:1.25rem; letter-spacing:.05em; color:var(--accent); text-align:center;
    font-variant-numeric: tabular-nums;
  }
  .picker-range{
    -webkit-appearance:none; appearance:none;
    display:block; width:100%; margin:14px 0 2px; height:18px;
    background:transparent; cursor:pointer;
  }
  .picker-range:focus{ outline:none; }
  .picker-range:focus-visible::-webkit-slider-thumb{ box-shadow:0 0 0 4px rgba(255,190,110,.35), 0 0 12px rgba(255,150,50,.7); }
  .picker-range:focus-visible::-moz-range-thumb{ box-shadow:0 0 0 4px rgba(255,190,110,.35), 0 0 12px rgba(255,150,50,.7); }
  .picker-range::-webkit-slider-runnable-track{
    height:3px; border-radius:2px;
    background:linear-gradient(90deg,
      var(--accent-mid) var(--fill,100%), rgba(232,220,198,.16) var(--fill,100%));
  }
  .picker-range::-webkit-slider-thumb{
    -webkit-appearance:none; width:15px; height:15px; margin-top:-6px; border:0; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, var(--thumb-1), var(--thumb-2) 70%);
    box-shadow:0 0 10px rgba(255,150,50,.6);
  }
  .picker-range::-moz-range-track{ height:3px; border-radius:2px; background:rgba(232,220,198,.16); }
  .picker-range::-moz-range-progress{ height:3px; border-radius:2px; background:var(--accent-mid); }
  .picker-range::-moz-range-thumb{
    width:15px; height:15px; border:0; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, var(--thumb-1), var(--thumb-2) 70%);
    box-shadow:0 0 10px rgba(255,150,50,.6);
  }
  .picker-ends{
    display:flex; justify-content:space-between;
    font-size:.64rem; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(232,220,198,.28);
  }
  .picker-note{
    margin-top:11px; font-size:.64rem; letter-spacing:.1em;
    color:rgba(232,220,198,.24); text-align:center;
  }

  .swatches{
    display:flex; justify-content:center; align-items:center;
    gap:10px; flex-wrap:wrap; margin-top:15px;
  }
  .swatch{
    width:32px; height:32px; padding:0; cursor:pointer; border-radius:50%;
    border:1px solid rgba(232,220,198,.18);
    background:radial-gradient(circle at 38% 30%, var(--sw-1), var(--sw-2) 78%);
    box-shadow:0 0 10px var(--sw-glow);
    transition: transform .18s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .swatch:hover{ transform:translateY(-2px) scale(1.07); }
  .swatch:focus-visible{ outline:2px solid rgba(255,255,255,.7); outline-offset:3px; }
  .swatch[aria-pressed="true"]{
    border-color:rgba(255,255,255,.72);
    box-shadow:0 0 0 2px rgba(255,255,255,.16), 0 0 16px var(--sw-glow);
  }
  @media (prefers-reduced-motion: reduce){ .swatch:hover{ transform:none; } }

  @media (max-width:380px){
    /* keep all six on one row rather than wrapping 5 + 1 */
    .picker-inner{ padding:14px 14px 12px; }
    .swatches{ gap:8px; }
    .swatch{ width:28px; height:28px; }
  }
  @media (max-width:420px){
    .candle-area{ width:180px; }
    .candle{ width:78px; }
    .holder{ width:126px; }
  }
  @media (prefers-reduced-motion: reduce){
    .f-outer,.f-mid,.f-core,.wick-hint,.room.flicker{ animation:none !important; }
  }
</style>
</head>
<body>
  <div class="room" id="room"></div>

  <main class="stage" id="stage">
    <div class="candle-area">
      <div class="pool"></div>

      <div class="flame-slot">
        <div class="flame" aria-hidden="true">
          <span class="f-outer"></span>
          <span class="f-mid"></span>
          <span class="f-core"></span>
        </div>
        <div class="smoke" id="smoke" aria-hidden="true"><i></i><i></i><i></i></div>
        <button class="wick-hit" id="wick" aria-label="Light the candle">
          <span class="wick-hint" aria-hidden="true"></span>
          <span class="wick"></span>
        </button>
      </div>

      <div class="candle" id="candle">
        <span class="drip a"></span>
        <span class="drip b"></span>
      </div>
      <div class="holder"></div>
    </div>

    <div class="readout">
      <div class="time" id="time" role="timer" aria-live="off">2:00:00</div>
      <div class="label" id="label">click the wick to light</div>
      <div class="controls">
        <button class="ctl" id="snuff" hidden>Blow out</button>
        <button class="ctl" id="reset" hidden>Reset</button>
      </div>

      <div class="picker" id="picker">
        <div class="picker-tabs">
          <button class="picker-toggle" id="pickerToggle" aria-expanded="false" aria-controls="pickerPanel">change time</button>
          <span class="picker-sep" aria-hidden="true">&middot;</span>
          <button class="picker-toggle" id="colourToggle" aria-expanded="false" aria-controls="colourPanel">flame colour</button>
        </div>

        <div class="picker-panel" id="pickerPanel">
          <div class="picker-inner">
            <div class="picker-value" id="pickerValue">2 hr</div>
            <input class="picker-range" id="pickerRange" type="range"
                   min="5" max="120" step="5" value="120"
                   aria-label="Burn time in minutes">
            <div class="picker-ends"><span>5 min</span><span>2 hr</span></div>
            <p class="picker-note">Picks a fresh candle at that length.</p>
          </div>
        </div>

        <div class="picker-panel" id="colourPanel">
          <div class="picker-inner">
            <div class="picker-value" id="colourValue">Amber</div>
            <div class="swatches" id="swatches" role="group" aria-label="Flame colour"></div>
            <p class="picker-note">Sets the flame and the light it throws.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
(function(){
  const MIN_MINS   = 5;                    // shortest candle the slider offers
  const MAX_MINS   = 120;                  // longest — two hours
  const STEP_MINS  = 5;
  const DEFAULT_MS = MAX_MINS * 60 * 1000;
  const WAX_TALL   = 230;                  // px, full candle
  const WAX_STUB   = 46;                   // px, burnt down to a stub
  const STORE_KEY  = 'candle-timer-v1';

  // six flames. each one sets the wick, the three flame layers, the light it
  // throws on the room, and the warm text that reads against it.
  const FLAMES = [
    { id:'amber', name:'Amber', vars:{
      '--flame-outer-1':'rgba(255,148,40,.95)', '--flame-outer-2':'rgba(255,92,10,.55)', '--flame-outer-3':'rgba(255,60,0,0)',
      '--flame-mid-1':'#ffb43c', '--flame-mid-2':'#ffd97a', '--flame-mid-3':'#fff3c4',
      '--flame-core-1':'#5fa8ff', '--flame-core-2':'#cfe6ff',
      '--wick-lit-1':'#ffcf7a', '--wick-lit-2':'#6b3a16', '--wick-glow':'rgba(255,170,70,.9)',
      '--room-1':'rgba(255,168,72,.28)', '--room-2':'rgba(255,130,40,.13)', '--room-3':'rgba(120,60,20,.05)',
      '--pool-1':'rgba(255,160,60,.16)',
      '--accent':'#ffd9a0', '--accent-soft':'rgba(255,205,145,.55)', '--accent-glow':'rgba(255,150,50,.45)',
      '--accent-mid':'rgba(255,168,72,.85)', '--thumb-1':'#fff1d6', '--thumb-2':'#ff9e3f' } },

    { id:'rose', name:'Rose', vars:{
      '--flame-outer-1':'rgba(255,74,110,.92)', '--flame-outer-2':'rgba(214,18,64,.5)', '--flame-outer-3':'rgba(160,0,40,0)',
      '--flame-mid-1':'#ff5d7e', '--flame-mid-2':'#ff9ab0', '--flame-mid-3':'#ffdde5',
      '--flame-core-1':'#c23a8f', '--flame-core-2':'#ffd9f0',
      '--wick-lit-1':'#ffa8be', '--wick-lit-2':'#5e1626', '--wick-glow':'rgba(255,90,130,.85)',
      '--room-1':'rgba(255,80,120,.24)', '--room-2':'rgba(200,30,70,.12)', '--room-3':'rgba(90,15,35,.05)',
      '--pool-1':'rgba(255,90,130,.15)',
      '--accent':'#ffc2d2', '--accent-soft':'rgba(255,170,195,.55)', '--accent-glow':'rgba(255,60,110,.4)',
      '--accent-mid':'rgba(255,105,140,.85)', '--thumb-1':'#ffe1ea', '--thumb-2':'#ff5d84' } },

    { id:'violet', name:'Violet', vars:{
      '--flame-outer-1':'rgba(170,110,255,.9)', '--flame-outer-2':'rgba(110,50,210,.5)', '--flame-outer-3':'rgba(70,20,150,0)',
      '--flame-mid-1':'#a86bff', '--flame-mid-2':'#c9a4ff', '--flame-mid-3':'#eee0ff',
      '--flame-core-1':'#6f3bd6', '--flame-core-2':'#e2d0ff',
      '--wick-lit-1':'#c9a4ff', '--wick-lit-2':'#32194f', '--wick-glow':'rgba(170,110,255,.85)',
      '--room-1':'rgba(150,95,255,.22)', '--room-2':'rgba(95,40,190,.12)', '--room-3':'rgba(50,20,100,.05)',
      '--pool-1':'rgba(150,95,255,.15)',
      '--accent':'#d9c2ff', '--accent-soft':'rgba(200,175,255,.55)', '--accent-glow':'rgba(140,80,255,.4)',
      '--accent-mid':'rgba(160,105,255,.85)', '--thumb-1':'#efe3ff', '--thumb-2':'#9a5cff' } },

    { id:'ocean', name:'Ocean', vars:{
      '--flame-outer-1':'rgba(60,190,255,.9)', '--flame-outer-2':'rgba(10,110,220,.5)', '--flame-outer-3':'rgba(0,60,160,0)',
      '--flame-mid-1':'#3cc0ff', '--flame-mid-2':'#8fe0ff', '--flame-mid-3':'#dff6ff',
      '--flame-core-1':'#0a5fd0', '--flame-core-2':'#cfeeff',
      '--wick-lit-1':'#9fe2ff', '--wick-lit-2':'#10304f', '--wick-glow':'rgba(70,190,255,.85)',
      '--room-1':'rgba(70,180,255,.22)', '--room-2':'rgba(20,100,210,.12)', '--room-3':'rgba(10,45,95,.05)',
      '--pool-1':'rgba(70,180,255,.15)',
      '--accent':'#bfe8ff', '--accent-soft':'rgba(160,215,255,.55)', '--accent-glow':'rgba(60,160,255,.4)',
      '--accent-mid':'rgba(70,185,255,.85)', '--thumb-1':'#e2f6ff', '--thumb-2':'#3cb4ff' } },

    { id:'emerald', name:'Emerald', vars:{
      '--flame-outer-1':'rgba(90,240,160,.88)', '--flame-outer-2':'rgba(20,170,100,.5)', '--flame-outer-3':'rgba(0,110,60,0)',
      '--flame-mid-1':'#4fe39c', '--flame-mid-2':'#a4f5c8', '--flame-mid-3':'#e2fff0',
      '--flame-core-1':'#12a05f', '--flame-core-2':'#d5ffe8',
      '--wick-lit-1':'#a4f5c8', '--wick-lit-2':'#123a26', '--wick-glow':'rgba(90,235,160,.85)',
      '--room-1':'rgba(90,230,160,.2)', '--room-2':'rgba(25,160,100,.11)', '--room-3':'rgba(12,80,50,.05)',
      '--pool-1':'rgba(90,230,160,.14)',
      '--accent':'#c4f7db', '--accent-soft':'rgba(170,240,205,.55)', '--accent-glow':'rgba(60,215,140,.38)',
      '--accent-mid':'rgba(80,225,155,.85)', '--thumb-1':'#e4fff0', '--thumb-2':'#3fd991' } },

    { id:'moonlight', name:'Moonlight', vars:{
      '--flame-outer-1':'rgba(200,225,255,.85)', '--flame-outer-2':'rgba(140,175,230,.45)', '--flame-outer-3':'rgba(90,120,180,0)',
      '--flame-mid-1':'#cfe0ff', '--flame-mid-2':'#e8f1ff', '--flame-mid-3':'#ffffff',
      '--flame-core-1':'#8fb4e8', '--flame-core-2':'#ffffff',
      '--wick-lit-1':'#e8f1ff', '--wick-lit-2':'#30384a', '--wick-glow':'rgba(200,225,255,.8)',
      '--room-1':'rgba(190,215,255,.2)', '--room-2':'rgba(120,150,210,.1)', '--room-3':'rgba(60,75,110,.05)',
      '--pool-1':'rgba(190,215,255,.14)',
      '--accent':'#e6eeff', '--accent-soft':'rgba(210,225,255,.55)', '--accent-glow':'rgba(160,195,255,.35)',
      '--accent-mid':'rgba(190,215,255,.8)', '--thumb-1':'#f4f8ff', '--thumb-2':'#b9d0f5' } }
  ];

  const stage  = document.getElementById('stage');
  const room   = document.getElementById('room');
  const wick   = document.getElementById('wick');
  const candle = document.getElementById('candle');
  const smoke  = document.getElementById('smoke');
  const timeEl = document.getElementById('time');
  const label  = document.getElementById('label');
  const snuff  = document.getElementById('snuff');
  const reset  = document.getElementById('reset');
  const picker = document.getElementById('picker');
  const pickToggle = document.getElementById('pickerToggle');
  const pickPanel  = document.getElementById('pickerPanel');
  const pickValue  = document.getElementById('pickerValue');
  const pickRange  = document.getElementById('pickerRange');
  const colToggle  = document.getElementById('colourToggle');
  const colPanel   = document.getElementById('colourPanel');
  const colValue   = document.getElementById('colourValue');
  const swatches   = document.getElementById('swatches');

  // state: 'unlit' | 'burning' | 'paused' | 'done'
  let state = 'unlit';
  let totalMs = DEFAULT_MS;   // how long a full candle lasts
  let flameId = FLAMES[0].id; // which flame colour is burning
  let remaining = totalMs;    // ms left, authoritative while not burning
  let endAt = 0;              // timestamp the candle runs out, while burning
  let raf = null;
  let flickerTimer = null;
  let audioCtx = null;

  function msLeft(){
    return state === 'burning' ? Math.max(0, endAt - Date.now()) : remaining;
  }

  function fmt(ms){
    const t = Math.ceil(ms / 1000);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function paint(){
    const left = msLeft();
    timeEl.textContent = fmt(left);
    const frac = totalMs > 0 ? left / totalMs : 0;
    candle.style.height = (WAX_STUB + (WAX_TALL - WAX_STUB) * frac).toFixed(1) + 'px';
  }

  function setLabel(text){ label.textContent = text; }

  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({ state, remaining, endAt, totalMs, flameId }));
    }catch(e){ /* private mode, storage off — the timer still runs */ }
  }

  function load(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }catch(e){ d = null; }
    if(!d || typeof d.state !== 'string') return;
    if(typeof d.flameId === 'string' && FLAMES.some(f => f.id === d.flameId)){
      setFlame(d.flameId, false);
    }
    if(typeof d.totalMs === 'number' && isFinite(d.totalMs)){
      totalMs = clampMs(d.totalMs);
      remaining = totalMs;
      syncPicker();
      paint();
    }
    if(d.state === 'burning' && typeof d.endAt === 'number'){
      if(d.endAt - Date.now() > 0){ endAt = d.endAt; light(true); return; }
      remaining = 0; finish(true); return;
    }
    if(d.state === 'paused' && typeof d.remaining === 'number'){
      remaining = d.remaining; state = 'paused';
      stage.classList.add('done');
      snuff.hidden = true; reset.hidden = false;
      setLabel('paused — click the wick to relight');
      paint();
      return;
    }
    if(d.state === 'done'){ remaining = 0; finish(true); }
  }

  function tick(){
    paint();
    if(state === 'burning' && msLeft() <= 0){ finish(false); return; }
    raf = requestAnimationFrame(tick);
  }

  function startFlicker(){
    stopFlicker();
    const step = () => {
      // small random height wobble on top of the CSS keyframes
      document.documentElement.style.setProperty('--flame-h', (0.9 + Math.random()*0.22).toFixed(3));
      document.documentElement.style.setProperty('--glow', (0.86 + Math.random()*0.14).toFixed(3));
      flickerTimer = setTimeout(step, 110 + Math.random()*180);
    };
    step();
  }
  function stopFlicker(){
    if(flickerTimer){ clearTimeout(flickerTimer); flickerTimer = null; }
  }

  function light(resuming){
    if(state === 'burning') return;
    if(state === 'done' && remaining <= 0) return;   // nothing left to burn
    if(!resuming) endAt = Date.now() + remaining;
    state = 'burning';

    stage.classList.remove('done');
    stage.classList.add('lit');
    room.classList.add('flicker');
    smoke.classList.remove('puff');
    document.documentElement.style.setProperty('--glow', '0.92');
    wick.setAttribute('aria-label','Blow out the candle');

    snuff.hidden = false; reset.hidden = false;
    setLabel('burning');
    startFlicker();

    if(raf) cancelAnimationFrame(raf);
    tick();
    save();
  }

  function blowOut(){
    if(state !== 'burning') return;
    remaining = msLeft();
    state = 'paused';
    stage.classList.remove('lit');
    stage.classList.add('done');       // keeps the wax visible, light gone
    room.classList.remove('flicker');
    document.documentElement.style.setProperty('--glow', '0');
    stopFlicker();
    if(raf){ cancelAnimationFrame(raf); raf = null; }

    smoke.classList.remove('puff');
    void smoke.offsetWidth;            // restart the animation
    smoke.classList.add('puff');

    wick.setAttribute('aria-label','Light the candle');
    snuff.hidden = true; reset.hidden = false;
    setLabel('paused — click the wick to relight');
    paint();
    save();
  }

  function finish(silent){
    state = 'done';
    remaining = 0;
    stage.classList.remove('lit');
    stage.classList.add('done');
    room.classList.remove('flicker');
    document.documentElement.style.setProperty('--glow', '0');
    stopFlicker();
    if(raf){ cancelAnimationFrame(raf); raf = null; }

    if(!silent){
      smoke.classList.remove('puff');
      void smoke.offsetWidth;
      smoke.classList.add('puff');
      chime();
    }
    wick.setAttribute('aria-label','Candle burnt out — reset to start again');
    snuff.hidden = true; reset.hidden = false;
    setLabel('burnt out');
    paint();
    save();
  }

  function doReset(){
    state = 'unlit';
    remaining = totalMs;
    endAt = 0;
    stage.classList.remove('lit','done');
    room.classList.remove('flicker');
    smoke.classList.remove('puff');
    document.documentElement.style.setProperty('--glow','0');
    stopFlicker();
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    wick.setAttribute('aria-label','Light the candle');
    snuff.hidden = true; reset.hidden = true;
    setLabel('click the wick to light');
    paint();
    save();
  }

  // a quiet two-note bell when the wax runs out
  function chime(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = audioCtx || new AC();
      const now = audioCtx.currentTime;
      [[528, 0], [792, 0.55]].forEach(([freq, at]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + at);
        gain.gain.exponentialRampToValueAtTime(0.16, now + at + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 2.4);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + at);
        osc.stop(now + at + 2.5);
      });
    }catch(e){ /* audio blocked — the visual is the point */ }
  }

  // ---------- burn-time picker ----------
  function clampMs(ms){
    const mins = Math.round(ms / 60000 / STEP_MINS) * STEP_MINS;
    return Math.min(MAX_MINS, Math.max(MIN_MINS, mins)) * 60000;
  }

  function fmtDur(mins){
    if(mins < 60) return mins + ' min';
    const h = Math.floor(mins / 60), m = mins % 60;
    return h + ' hr' + (m ? ' ' + m + ' min' : '');
  }

  // paint the filled part of the track ourselves (webkit has no ::-moz-range-progress)
  function syncPicker(){
    const mins = Math.round(totalMs / 60000);
    pickRange.value = String(mins);
    pickValue.textContent = fmtDur(mins);
    const pct = (mins - MIN_MINS) / (MAX_MINS - MIN_MINS) * 100;
    pickRange.style.setProperty('--fill', pct.toFixed(1) + '%');
  }

  function previewPicker(){
    const mins = Number(pickRange.value);
    pickValue.textContent = fmtDur(mins);
    const pct = (mins - MIN_MINS) / (MAX_MINS - MIN_MINS) * 100;
    pickRange.style.setProperty('--fill', pct.toFixed(1) + '%');
  }

  function applyDuration(){
    const next = clampMs(Number(pickRange.value) * 60000);
    if(next === totalMs && state === 'unlit'){ syncPicker(); return; }
    totalMs = next;
    if(state === 'burning'){
      // keep the flame, but start a fresh candle of the new length
      remaining = totalMs;
      endAt = Date.now() + totalMs;
      paint();
      save();
    }else{
      doReset();              // fresh unlit candle, full height
    }
    syncPicker();
  }

  // ---------- flame colour ----------
  function setFlame(id, persist){
    const f = FLAMES.find(x => x.id === id) || FLAMES[0];
    flameId = f.id;
    const root = document.documentElement;
    for(const key in f.vars) root.style.setProperty(key, f.vars[key]);
    colValue.textContent = f.name;
    swatches.querySelectorAll('.swatch').forEach(b => {
      b.setAttribute('aria-pressed', b.dataset.id === f.id ? 'true' : 'false');
    });
    if(persist) save();
  }

  FLAMES.forEach(f => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.dataset.id = f.id;
    b.title = f.name;
    b.setAttribute('aria-label', f.name + ' flame');
    b.setAttribute('aria-pressed', 'false');
    b.style.setProperty('--sw-1', f.vars['--flame-mid-2']);
    b.style.setProperty('--sw-2', f.vars['--flame-outer-1']);
    b.style.setProperty('--sw-glow', f.vars['--accent-glow']);
    b.addEventListener('click', () => setFlame(f.id, true));
    swatches.appendChild(b);
  });

  // ---------- one menu open at a time ----------
  const MENUS = [
    { panel: pickPanel, toggle: pickToggle, onOpen: () => { syncPicker(); pickRange.focus({ preventScroll:true }); } },
    { panel: colPanel,  toggle: colToggle,  onOpen: () => { const on = swatches.querySelector('[aria-pressed="true"]') || swatches.firstElementChild; if(on) on.focus({ preventScroll:true }); } }
  ];

  function openMenu(menu, open){
    MENUS.forEach(m => {
      const want = (m === menu) && open;
      m.panel.classList.toggle('open', want);
      m.toggle.setAttribute('aria-expanded', want ? 'true' : 'false');
    });
    if(open){
      menu.onOpen();
      // on a short screen the panel opens below the fold — bring it into view
      setTimeout(() => menu.panel.scrollIntoView({ block:'nearest', behavior:'smooth' }), 320);
    }
  }

  function openMenuCount(){ return MENUS.filter(m => m.panel.classList.contains('open')).length; }

  MENUS.forEach(m => {
    m.toggle.addEventListener('click', () => openMenu(m, !m.panel.classList.contains('open')));
  });

  pickRange.addEventListener('input', previewPicker);
  pickRange.addEventListener('change', applyDuration);

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    const open = MENUS.find(m => m.panel.classList.contains('open'));
    if(open){ openMenu(open, false); open.toggle.focus(); }
  });
  document.addEventListener('pointerdown', (e) => {
    if(openMenuCount() && !picker.contains(e.target)) openMenu(null, false);
  });

  wick.addEventListener('click', () => {
    if(state === 'burning') blowOut();
    else if(state === 'done') doReset();
    else light(false);
  });
  snuff.addEventListener('click', blowOut);
  reset.addEventListener('click', doReset);

  // a backgrounded tab throttles rAF; recompute on the way back
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && state === 'burning'){
      if(msLeft() <= 0) finish(false); else paint();
    }
  });
  window.addEventListener('beforeunload', save);

  setFlame(flameId, false);
  syncPicker();
  paint();
  load();
})();
</script>
</body>
</html>
