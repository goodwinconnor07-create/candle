<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candle Timer</title>
<style>
  :root{
    --flame-h: 1;          /* flicker multiplier, nudged by JS */
    --glow: 0;             /* room light level 0..1 */
    --wax: #efe2c8;
    --wax-shade: #c8b795;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#000;
    color:#e8dcc6;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:24px 16px; overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* the dim room: a pool of light that only exists once the wick catches */
  .room{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(60vmin 55vmin at 50% 46%,
        rgba(255,168,72,.28) 0%,
        rgba(255,130,40,.13) 35%,
        rgba(120,60,20,.05) 60%,
        rgba(0,0,0,0) 78%);
    opacity: calc(var(--glow) * 1);
    transition: opacity 1.4s ease;
  }
  .room.flicker{ animation: roomBreathe 5.5s ease-in-out infinite; }
  @keyframes roomBreathe{ 0%,100%{ filter:brightness(1) } 43%{ filter:brightness(1.12) } 70%{ filter:brightness(.93) } }

  .stage{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:34px;
  }

  /* ---------- candle ---------- */
  .candle-area{
    position:relative; width:220px; height:364px;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  }
  /* the candle's height is the burn-down readout, so never let flex shrink it */
  .flame-slot, .candle, .holder{ flex:0 0 auto; }

  .flame-slot{ position:relative; width:60px; height:96px; }

  .wick-hit{
    position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    width:64px; height:74px; border:0; background:transparent; padding:0;
    cursor:pointer; border-radius:32px;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .wick-hit:focus-visible{ outline:2px solid rgba(255,190,110,.75); outline-offset:4px; }
  .wick{
    width:3px; height:15px; border-radius:2px 2px 0 0;
    background:linear-gradient(#4b4038,#22201e);
    transition: background .8s ease, box-shadow .8s ease;
  }
  .lit .wick{
    background:linear-gradient(#ffcf7a,#6b3a16);
    box-shadow:0 0 6px rgba(255,170,70,.9);
  }
  /* small hint pulse so it's obvious what to click */
  .wick-hint{
    position:absolute; left:50%; bottom:2px; transform:translateX(-50%);
    width:26px; height:26px; border-radius:50%;
    border:1px solid rgba(232,220,198,.28);
    animation: hintPulse 2.6s ease-in-out infinite;
    pointer-events:none;
  }
  .lit .wick-hint, .done .wick-hint{ display:none; }
  @keyframes hintPulse{
    0%,100%{ transform:translateX(-50%) scale(.85); opacity:.18 }
    50%    { transform:translateX(-50%) scale(1.25); opacity:.5 }
  }

  /* flame: three stacked blurred blobs */
  .flame{
    position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
    width:34px; height:74px; opacity:0; pointer-events:none;
    transition: opacity .35s ease;
  }
  .lit .flame{ opacity:1; }
  .flame span{
    position:absolute; left:50%; bottom:0; display:block;
    border-radius:50% 50% 34% 34% / 66% 66% 34% 34%;
    transform-origin:50% 100%;
  }
  .f-outer{
    width:34px; height:74px; margin-left:-17px;
    background:radial-gradient(ellipse at 50% 88%, rgba(255,148,40,.95), rgba(255,92,10,.55) 55%, rgba(255,60,0,0) 78%);
    filter:blur(5px);
    animation: flick 2.1s ease-in-out infinite;
  }
  .f-mid{
    width:20px; height:50px; margin-left:-10px;
    background:linear-gradient(to top, #ffb43c 0%, #ffd97a 45%, #fff3c4 78%, rgba(255,255,255,.2) 100%);
    filter:blur(1.6px);
    animation: flick 1.5s ease-in-out infinite reverse;
  }
  .f-core{
    width:8px; height:17px; margin-left:-4px;
    background:linear-gradient(to top, #5fa8ff, #cfe6ff 60%, rgba(255,255,255,.85));
    filter:blur(1.5px); opacity:.85;
    animation: flick 1.1s ease-in-out infinite;
  }
  @keyframes flick{
    0%,100%{ transform: scale(1, calc(1 * var(--flame-h))) translateX(0) skewX(0deg) }
    22%    { transform: scale(.94, calc(1.07 * var(--flame-h))) translateX(-1px) skewX(-2.5deg) }
    48%    { transform: scale(1.05, calc(.9 * var(--flame-h))) translateX(1px) skewX(2deg) }
    74%    { transform: scale(.97, calc(1.04 * var(--flame-h))) translateX(-.5px) skewX(-1deg) }
  }

  /* smoke when it goes out */
  .smoke{ position:absolute; left:50%; bottom:16px; width:2px; height:2px; pointer-events:none; }
  .smoke i{
    position:absolute; left:0; bottom:0; width:9px; height:9px; margin-left:-4px;
    border-radius:50%; background:rgba(200,200,205,.34); filter:blur(4px); opacity:0;
  }
  .smoke.puff i{ animation: rise 2.8s ease-out forwards; }
  .smoke.puff i:nth-child(2){ animation-delay:.28s }
  .smoke.puff i:nth-child(3){ animation-delay:.56s }
  @keyframes rise{
    0%  { opacity:.55; transform:translate(0,0) scale(.6) }
    45% { opacity:.35; transform:translate(7px,-42px) scale(1.5) }
    100%{ opacity:0;   transform:translate(-5px,-96px) scale(2.4) }
  }

  .candle{
    position:relative; width:92px;
    height:230px;                       /* JS shrinks this as time burns down */
    border-radius:8px 8px 5px 5px;
    background:
      linear-gradient(90deg,
        rgba(0,0,0,.42) 0%, rgba(0,0,0,.12) 14%,
        rgba(255,255,255,.16) 38%, rgba(255,255,255,.05) 62%,
        rgba(0,0,0,.2) 86%, rgba(0,0,0,.45) 100%),
      linear-gradient(to bottom, var(--wax-shade), var(--wax) 12%, var(--wax) 78%, #d9c9a8 100%);
    filter: brightness(.34) saturate(.45);
    transition: filter 1.4s ease, height .9s linear;
  }
  .lit .candle{ filter: brightness(1) saturate(1); }
  .done .candle{ filter: brightness(.62) saturate(.8); }   /* afterglow, no flame */
  .candle::before{                       /* molten top */
    content:""; position:absolute; top:-7px; left:0; right:0; height:14px;
    border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%, #fff6e2, #e6d5b4 60%, #cbb894);
  }
  .candle::after{                        /* wax pooled in the dip */
    content:""; position:absolute; top:-2px; left:50%; transform:translateX(-50%);
    width:34px; height:8px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(180,150,105,.85), rgba(180,150,105,0) 70%);
  }
  .drip{
    position:absolute; width:11px; border-radius:6px 6px 8px 8px;
    background:linear-gradient(to bottom, #f6ebd6, #dbc9a6);
    box-shadow:inset -2px 0 3px rgba(0,0,0,.18);
  }
  .drip.a{ left:9px; top:6px; height:44px; }
  .drip.b{ right:13px; top:2px; height:26px; width:9px; }

  .holder{
    width:150px; height:22px; margin-top:-3px; border-radius:50%;
    background:radial-gradient(ellipse at 50% 34%, #6b5a45, #3a3027 62%, #14110e);
    filter: brightness(.4);
    transition: filter 1.4s ease;
  }
  .lit .holder{ filter: brightness(1); }
  .done .holder{ filter: brightness(.62); }
  .pool{
    position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
    width:250px; height:40px; border-radius:50%;
    background:radial-gradient(ellipse, rgba(255,160,60,.16), rgba(255,140,40,0) 70%);
    opacity:var(--glow); transition:opacity 1.4s ease; pointer-events:none;
  }

  /* ---------- readout ---------- */
  .readout{ text-align:center; }
  .time{
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.6rem, 11vw, 4.2rem);
    letter-spacing:.06em; line-height:1;
    color:rgba(232,220,198,.3);
    transition:color 1.4s ease, text-shadow 1.4s ease;
  }
  .lit .time{ color:#ffd9a0; text-shadow:0 0 22px rgba(255,150,50,.45); }
  .done .time{ color:rgba(232,220,198,.55); }
  .label{
    margin-top:12px; font-size:.82rem; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(232,220,198,.32); transition:color 1.2s ease;
  }
  .lit .label{ color:rgba(255,205,145,.55); }

  .controls{ margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button.ctl{
    font: inherit; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(232,220,198,.6); background:transparent;
    border:1px solid rgba(232,220,198,.22); border-radius:999px;
    padding:9px 18px; cursor:pointer;
    transition: color .25s ease, border-color .25s ease, background .25s ease;
  }
  button.ctl:hover{ color:#ffd9a0; border-color:rgba(255,190,120,.5); background:rgba(255,160,60,.07); }
  button.ctl:focus-visible{ outline:2px solid rgba(255,190,110,.7); outline-offset:3px; }
  button.ctl[hidden]{ display:none; }

  @media (max-width:420px){
    .candle-area{ width:180px; }
    .candle{ width:78px; }
    .holder{ width:126px; }
  }
  @media (prefers-reduced-motion: reduce){
    .f-outer,.f-mid,.f-core,.wick-hint,.room.flicker{ animation:none !important; }
  }
</style>
</head>
<body>
  <div class="room" id="room"></div>

  <main class="stage" id="stage">
    <div class="candle-area">
      <div class="pool"></div>

      <div class="flame-slot">
        <div class="flame" aria-hidden="true">
          <span class="f-outer"></span>
          <span class="f-mid"></span>
          <span class="f-core"></span>
        </div>
        <div class="smoke" id="smoke" aria-hidden="true"><i></i><i></i><i></i></div>
        <button class="wick-hit" id="wick" aria-label="Light the candle">
          <span class="wick-hint" aria-hidden="true"></span>
          <span class="wick"></span>
        </button>
      </div>

      <div class="candle" id="candle">
        <span class="drip a"></span>
        <span class="drip b"></span>
      </div>
      <div class="holder"></div>
    </div>

    <div class="readout">
      <div class="time" id="time" role="timer" aria-live="off">2:00:00</div>
      <div class="label" id="label">click the wick to light</div>
      <div class="controls">
        <button class="ctl" id="snuff" hidden>Blow out</button>
        <button class="ctl" id="reset" hidden>Reset</button>
      </div>
    </div>
  </main>

<script>
(function(){
  const TOTAL_MS   = 2 * 60 * 60 * 1000;   // two hours
  const WAX_TALL   = 230;                  // px, full candle
  const WAX_STUB   = 46;                   // px, burnt down to a stub
  const STORE_KEY  = 'candle-timer-v1';

  const stage  = document.getElementById('stage');
  const room   = document.getElementById('room');
  const wick   = document.getElementById('wick');
  const candle = document.getElementById('candle');
  const smoke  = document.getElementById('smoke');
  const timeEl = document.getElementById('time');
  const label  = document.getElementById('label');
  const snuff  = document.getElementById('snuff');
  const reset  = document.getElementById('reset');

  // state: 'unlit' | 'burning' | 'paused' | 'done'
  let state = 'unlit';
  let remaining = TOTAL_MS;   // ms left, authoritative while not burning
  let endAt = 0;              // timestamp the candle runs out, while burning
  let raf = null;
  let flickerTimer = null;
  let audioCtx = null;

  function msLeft(){
    return state === 'burning' ? Math.max(0, endAt - Date.now()) : remaining;
  }

  function fmt(ms){
    const t = Math.ceil(ms / 1000);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const s = t % 60;
    return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function paint(){
    const left = msLeft();
    timeEl.textContent = fmt(left);
    const frac = left / TOTAL_MS;
    candle.style.height = (WAX_STUB + (WAX_TALL - WAX_STUB) * frac).toFixed(1) + 'px';
  }

  function setLabel(text){ label.textContent = text; }

  function save(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({ state, remaining, endAt }));
    }catch(e){ /* private mode, storage off — the timer still runs */ }
  }

  function load(){
    let d = null;
    try{ d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); }catch(e){ d = null; }
    if(!d || typeof d.state !== 'string') return;
    if(d.state === 'burning' && typeof d.endAt === 'number'){
      if(d.endAt - Date.now() > 0){ endAt = d.endAt; light(true); return; }
      remaining = 0; finish(true); return;
    }
    if(d.state === 'paused' && typeof d.remaining === 'number'){
      remaining = d.remaining; state = 'paused';
      stage.classList.add('done');
      snuff.hidden = true; reset.hidden = false;
      setLabel('paused — click the wick to relight');
      paint();
      return;
    }
    if(d.state === 'done'){ remaining = 0; finish(true); }
  }

  function tick(){
    paint();
    if(state === 'burning' && msLeft() <= 0){ finish(false); return; }
    raf = requestAnimationFrame(tick);
  }

  function startFlicker(){
    stopFlicker();
    const step = () => {
      // small random height wobble on top of the CSS keyframes
      document.documentElement.style.setProperty('--flame-h', (0.9 + Math.random()*0.22).toFixed(3));
      document.documentElement.style.setProperty('--glow', (0.86 + Math.random()*0.14).toFixed(3));
      flickerTimer = setTimeout(step, 110 + Math.random()*180);
    };
    step();
  }
  function stopFlicker(){
    if(flickerTimer){ clearTimeout(flickerTimer); flickerTimer = null; }
  }

  function light(resuming){
    if(state === 'burning') return;
    if(state === 'done' && remaining <= 0) return;   // nothing left to burn
    if(!resuming) endAt = Date.now() + remaining;
    state = 'burning';

    stage.classList.remove('done');
    stage.classList.add('lit');
    room.classList.add('flicker');
    smoke.classList.remove('puff');
    document.documentElement.style.setProperty('--glow', '0.92');
    wick.setAttribute('aria-label','Blow out the candle');

    snuff.hidden = false; reset.hidden = false;
    setLabel('burning');
    startFlicker();

    if(raf) cancelAnimationFrame(raf);
    tick();
    save();
  }

  function blowOut(){
    if(state !== 'burning') return;
    remaining = msLeft();
    state = 'paused';
    stage.classList.remove('lit');
    stage.classList.add('done');       // keeps the wax visible, light gone
    room.classList.remove('flicker');
    document.documentElement.style.setProperty('--glow', '0');
    stopFlicker();
    if(raf){ cancelAnimationFrame(raf); raf = null; }

    smoke.classList.remove('puff');
    void smoke.offsetWidth;            // restart the animation
    smoke.classList.add('puff');

    wick.setAttribute('aria-label','Light the candle');
    snuff.hidden = true; reset.hidden = false;
    setLabel('paused — click the wick to relight');
    paint();
    save();
  }

  function finish(silent){
    state = 'done';
    remaining = 0;
    stage.classList.remove('lit');
    stage.classList.add('done');
    room.classList.remove('flicker');
    document.documentElement.style.setProperty('--glow', '0');
    stopFlicker();
    if(raf){ cancelAnimationFrame(raf); raf = null; }

    if(!silent){
      smoke.classList.remove('puff');
      void smoke.offsetWidth;
      smoke.classList.add('puff');
      chime();
    }
    wick.setAttribute('aria-label','Candle burnt out — reset to start again');
    snuff.hidden = true; reset.hidden = false;
    setLabel('burnt out');
    paint();
    save();
  }

  function doReset(){
    state = 'unlit';
    remaining = TOTAL_MS;
    endAt = 0;
    stage.classList.remove('lit','done');
    room.classList.remove('flicker');
    smoke.classList.remove('puff');
    document.documentElement.style.setProperty('--glow','0');
    stopFlicker();
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    wick.setAttribute('aria-label','Light the candle');
    snuff.hidden = true; reset.hidden = true;
    setLabel('click the wick to light');
    paint();
    save();
  }

  // a quiet two-note bell when the wax runs out
  function chime(){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = audioCtx || new AC();
      const now = audioCtx.currentTime;
      [[528, 0], [792, 0.55]].forEach(([freq, at]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, now + at);
        gain.gain.exponentialRampToValueAtTime(0.16, now + at + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 2.4);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now + at);
        osc.stop(now + at + 2.5);
      });
    }catch(e){ /* audio blocked — the visual is the point */ }
  }

  wick.addEventListener('click', () => {
    if(state === 'burning') blowOut();
    else if(state === 'done') doReset();
    else light(false);
  });
  snuff.addEventListener('click', blowOut);
  reset.addEventListener('click', doReset);

  // a backgrounded tab throttles rAF; recompute on the way back
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && state === 'burning'){
      if(msLeft() <= 0) finish(false); else paint();
    }
  });
  window.addEventListener('beforeunload', save);

  paint();
  load();
})();
</script>
</body>
</html>
